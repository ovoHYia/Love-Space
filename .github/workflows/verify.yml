name: 验证

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: love_space_test
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: 安装前端依赖
        working-directory: frontend
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          DB_URL: ""
          DB_USERNAME: ""
          DB_PASSWORD: ""
          DB_HOST: ""
          DB_PORT: ""
          DB_NAME: ""
          SETUP_TOKEN: ""
          PASSWORD_RESET_TOKEN: ""
          MYSQL_TEST_PASSWORD: ""
        run: npm ci
      - name: 前端测试与构建
        working-directory: frontend
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          DB_URL: ""
          DB_USERNAME: ""
          DB_PASSWORD: ""
          DB_HOST: ""
          DB_PORT: ""
          DB_NAME: ""
          SETUP_TOKEN: ""
          PASSWORD_RESET_TOKEN: ""
          MYSQL_TEST_PASSWORD: ""
        run: |
          npm test
          npm run build
          npm audit --audit-level=high --registry=https://registry.npmjs.org/
      - name: 后端测试、打包和真实 MySQL 迁移验证
        env:
          MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/love_space_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          MYSQL_TEST_USERNAME: root
          MYSQL_TEST_PASSWORD: test-password
        run: mvn -f backend/pom.xml clean package
      - name: 检查最终 JAR 的前端首页和静态资源
        run: |
          test -f frontend/dist/index.html
          jar tf backend/target/love-space-backend-1.0.0.jar | grep -Fxq 'BOOT-INF/classes/static/index.html'
          jar tf backend/target/love-space-backend-1.0.0.jar | grep -Eq '^BOOT-INF/classes/static/assets/.+'
