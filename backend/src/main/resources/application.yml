spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
  mvc:
    async:
      # 慢速/挂起的导出流最多占用 10 分钟，超时后释放导出槽位
      request-timeout: 600000
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:200MB}
      max-request-size: ${MAX_REQUEST_SIZE:220MB}
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 30d
app:
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  media-quarantine-dir: ${MEDIA_QUARANTINE_DIR:./data/media-quarantine}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  media-max-bytes: ${MEDIA_MAX_BYTES:209715200}
  media-total-max-bytes: ${MEDIA_TOTAL_MAX_BYTES:2147483648}
  media-min-free-bytes: ${MEDIA_MIN_FREE_BYTES:67108864}
  data-export:
    max-concurrent: ${DATA_EXPORT_MAX_CONCURRENT:1}
    dir: ${DATA_EXPORT_DIR:./data/exports}
    min-free-bytes: ${DATA_EXPORT_MIN_FREE_BYTES:67108864}
    ttl-minutes: ${DATA_EXPORT_TTL_MINUTES:10}
    max-pending: ${DATA_EXPORT_MAX_PENDING:2}
  security:
    login:
      max-attempts-per-ip: ${LOGIN_MAX_ATTEMPTS_PER_IP:30}
      max-failures-per-identity: ${LOGIN_MAX_FAILURES_PER_IDENTITY:8}
      max-tracked-entries: ${LOGIN_MAX_TRACKED_ENTRIES:5000}
      window-minutes: ${LOGIN_WINDOW_MINUTES:15}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}
      evict-after-minutes: ${LOGIN_EVICT_AFTER_MINUTES:30}
    password-reset:
      max-attempts-per-ip: ${PASSWORD_RESET_MAX_ATTEMPTS_PER_IP:20}
      max-failures-per-identity: ${PASSWORD_RESET_MAX_FAILURES_PER_IDENTITY:5}
      max-tracked-entries: ${PASSWORD_RESET_MAX_TRACKED_ENTRIES:5000}
      window-minutes: ${PASSWORD_RESET_WINDOW_MINUTES:15}
      lock-minutes: ${PASSWORD_RESET_LOCK_MINUTES:15}
      evict-after-minutes: ${PASSWORD_RESET_EVICT_AFTER_MINUTES:30}
    setup:
      enabled: ${SETUP_ENABLED:true}
      max-attempts-per-ip: ${SETUP_MAX_ATTEMPTS_PER_IP:10}
      max-attempts-global: ${SETUP_MAX_ATTEMPTS_GLOBAL:100}
      max-tracked-entries: ${SETUP_MAX_TRACKED_ENTRIES:5000}
      window-minutes: ${SETUP_WINDOW_MINUTES:15}
      lock-minutes: ${SETUP_LOCK_MINUTES:15}
      evict-after-minutes: ${SETUP_EVICT_AFTER_MINUTES:30}
