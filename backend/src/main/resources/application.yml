spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:200MB}
      max-request-size: ${MAX_REQUEST_SIZE:220MB}
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 30d
app:
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  media-max-bytes: ${MEDIA_MAX_BYTES:209715200}
  media-total-max-bytes: ${MEDIA_TOTAL_MAX_BYTES:2147483648}
