spring:
  datasource:
    url: jdbc:h2:mem:lovespace;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  scheduling-enabled: false
  upload-dir: ${java.io.tmpdir}/love-space-test-uploads
  cors-allowed-origins: http://localhost:5173
  media-max-bytes: 1048576
  security:
    password-reset:
      max-attempts-per-ip: 5
      max-failures-per-identity: 3
      window-minutes: 15
      lock-minutes: 15
      evict-after-minutes: 30
SETUP_TOKEN: test-setup-token
PASSWORD_RESET_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
